<script>
const Q=[
// ── SECTION 0: INTRO TO DIGITAL MARKETS ──────────────────────────────────────
{t:"Digital Markets",b:"bs0",q:"What is the key difference between ethics and law?",o:["Ethics is enforced by the state; law is voluntary","Ethics is voluntary internal moral compliance; law is a formal system of rules imposed by sovereign authority","Ethics and law are identical concepts","Law is based on moral principles; ethics is based on written statutes"],a:1,e:"Ethics is voluntary internal compliance; law is formally imposed by sovereign authority with enforcement mechanisms."},
{t:"Digital Markets",b:"bs0",q:"Natural law refers to:",o:["Written laws, statutes, and formal regulations","Laws governing environmental protection","Universal, immutable moral principles inherent in humans (dignity, justice)","Regulations passed by the European Parliament"],a:2,e:"Natural law refers to universal, immutable moral principles inherent in humans — dignity, justice — not written statutes."},
{t:"Digital Markets",b:"bs0",q:"Which of the following is an example of positive law?",o:["The concept of human dignity","The principle of justice","The EU GDPR","The Golden Rule"],a:2,e:"Positive law is written, enacted law created by sovereign authority. The GDPR is a concrete regulation — unlike natural law principles."},
{t:"Digital Markets",b:"bs0",q:"The regulatory function of law aims to:",o:["Impose criminal penalties","Solve conflicts between parties","Orient market and society towards the common good","Promote national holidays"],a:2,e:"The regulatory function orients markets and society toward the common good — e.g., antitrust law, consumer protection."},
{t:"Digital Markets",b:"bs0",q:"Antitrust regulation is an example of which function of law?",o:["Preventive function","Sanctionatory function","Regulatory function","Dispute resolution"],a:2,e:"Antitrust orients the market toward competition and the common good — this is the regulatory function."},
{t:"Digital Markets",b:"bs0",q:"The preventive function of law aims to:",o:["Impose consequences for violations","Stop harmful actions before they occur","Resolve disputes between parties","Promote essential values"],a:1,e:"The preventive function deters harmful actions before they happen, through rules and the threat of sanctions."},
{t:"Digital Markets",b:"bs0",q:"The three components of a legal system are:",o:["Constitution, statutes, regulations","Laws, legislature, judiciary","Ethics, morals, customs","Parliament, government, police"],a:1,e:"A legal system has three components: laws (norms), legislature (law-making), and judiciary (enforcement/interpretation)."},
{t:"Digital Markets",b:"bs0",q:"The core principles of a legal system are:",o:["Efficiency, profitability, innovation","Justice, freedom, and rule of law","Democracy, socialism, liberalism","Transparency, accountability, privacy"],a:1,e:"The foundational pillars of any legal system are justice, freedom, and rule of law."},
{t:"Digital Markets",b:"bs0",q:'"Rule of law" means:',o:["The government can act without constraints","Nobody is above the law","Only judges can make laws","Laws only apply to citizens, not officials"],a:1,e:"Rule of law: nobody — not even the government — is above the law. It guarantees equal application to all."},
{t:"Digital Markets",b:"bs0",q:"Principles (or optimization mandates) in a legal system:",o:["Are structured If…Then mandates","Are objectives that must be fulfilled to the largest extent possible","Are only applicable in criminal law","Cannot be overridden by rules"],a:1,e:"Legal principles are optimization mandates — objectives like proportionality that must be fulfilled as much as possible within legal and factual constraints."},
{t:"Digital Markets",b:"bs0",q:"Rules in a legal system follow which model?",o:["Proportionality and reasonability","If…Then (condition leads to consequence)","Open-ended moral guidance","Subjective interpretation only"],a:1,e:"Rules follow the If…Then model: if a specific condition is met, a specific legal consequence follows."},
{t:"Digital Markets",b:"bs0",q:"Every contract must have which three types of elements?",o:["Price, quantity, delivery","Essential, natural, and accidental elements","Offer, acceptance, consideration","Buyer, seller, intermediary"],a:1,e:"Every contract has essential elements (for existence), natural elements (implied by default), and accidental elements (added by parties)."},
{t:"Digital Markets",b:"bs0",q:'"Lex posterior derogat priori" means:',o:["A specific law overrides a general law","A higher-ranking law overrides a lower-ranking one","A later law repeals an earlier one","International law overrides national law"],a:2,e:"Lex posterior derogat priori: a later law repeals an earlier one on the same subject."},
{t:"Digital Markets",b:"bs0",q:'"Lex specialis derogat generali" means:',o:["A later law repeals an earlier one","A specific law overrides a general law","A higher-ranking law overrides a lower-ranking one","EU law overrides national law"],a:1,e:"Lex specialis derogat generali: a specific law overrides a general law when two norms conflict."},
{t:"Digital Markets",b:"bs0",q:'"Lex superior derogat inferiori" means:',o:["A later law repeals an earlier one","A specific law overrides a general law","A higher-ranking law overrides a lower-ranking one","Private law overrides public law"],a:2,e:"Lex superior derogat inferiori: a higher-ranking law (e.g., Constitution) overrides a lower-ranking one (e.g., a decree)."},
{t:"Digital Markets",b:"bs0",q:"In the hierarchy of norms, which source ranks highest?",o:["Internal national law","Administrative regulations","Constitution","Jurisprudence"],a:2,e:"The Constitution is the supreme law — all other norms must conform to it."},
{t:"Digital Markets",b:"bs0",q:"Where does EU Law (Supranational Law) rank in the hierarchy of norms?",o:["1st (above Constitution)","2nd (after Constitution, before International Law)","3rd (after Constitution and International Law)","4th (after Internal national law)"],a:2,e:"In the Spanish hierarchy: Constitution > International > Supranational (EU) > Internal national law. EU law ranks 3rd."},
{t:"Digital Markets",b:"bs0",q:"Teleological or Purposive Interpretation means:",o:["Each clause must be construed in harmony with the legal system","Rules must be interpreted considering their original purpose","All provisions must conform with constitutional rights","Laws must be interpreted literally"],a:1,e:"Teleological (purposive) interpretation: interpret a rule in light of its original purpose or objective — what the legislator intended."},
{t:"Digital Markets",b:"bs0",q:"A consumer surplus is:",o:["The extra profit a producer makes above production cost","The financial benefit gained when a customer buys a product for less than the maximum they are willing to pay","The amount of unsold inventory","The difference between revenue and expenses"],a:1,e:"Consumer surplus = what a consumer is willing to pay minus what they actually pay — their net benefit from the transaction."},
{t:"Digital Markets",b:"bs0",q:"A producer surplus is:",o:["The benefit gained when a customer pays less than willing","The benefit gained by producers when they sell at a market price higher than their cost of production","Unsold goods in inventory","Tax benefits received by manufacturers"],a:1,e:"Producer surplus = market price minus cost of production — the net benefit to the seller."},
{t:"Digital Markets",b:"bs0",q:'A "prosumer" in digital markets is:',o:["A professional consumer who buys in bulk","A user who consumes content but also generates valuable data (like reviews)","A producer who never consumes","A government regulator of consumer markets"],a:1,e:"A prosumer both consumes and produces — e.g., a Netflix user who also writes reviews generating commercial value for the platform."},
{t:"Digital Markets",b:"bs0",q:'What distinguishes a "digitalized market" from a "digital market"?',o:["They are exactly the same thing","A digitalized market is a traditional market using digital tools; a digital market is native from digital infrastructures","A digital market uses physical stores; a digitalized market does not","A digitalized market only exists online; a digital market is hybrid"],a:1,e:"Digitalized market = traditional market using digital tools (e.g., a taxi company with an app). Digital market = natively born from digital infrastructure (e.g., Uber)."},
{t:"Digital Markets",b:"bs0",q:"The balance sheet equation is:",o:["Revenue - Expenses = Profit","Assets = Liabilities + Equity","Cash In - Cash Out = Net Cash","Income = Revenue - Costs"],a:1,e:"Balance sheet equation: Assets = Liabilities + Equity. Shows financial position at a point in time."},
{t:"Digital Markets",b:"bs0",q:"The income statement measures:",o:["Net worth of the business","Movement of cash in and out","Financial performance over a period (solvency)","Assets owned by the company"],a:2,e:"The income statement (P&L) measures financial performance over a period — revenues minus expenses showing profit or loss."},
{t:"Digital Markets",b:"bs0",q:"In a Marketplace business model, the platform:",o:["Owns all the inventory","Does not own the inventory; it manages transactions and earns a commission","Manufactures its own products","Only handles delivery logistics"],a:1,e:"Marketplace (e.g., Amazon Marketplace, eBay): the platform does not own inventory — it connects buyers and sellers and earns a commission."},
{t:"Digital Markets",b:"bs0",q:"Subscription agreements must legally display:",o:["The CEO's personal information","Explicit auto-renewal clauses and terms on recurring automatic payment processing","Competitor pricing comparisons","Stock market valuations"],a:1,e:"EU consumer law requires subscription agreements to clearly disclose auto-renewal clauses — protecting consumers from unexpected recurring charges."},
{t:"Digital Markets",b:"bs0",q:"In the Freemium model, regulatory risks include:",o:["Export controls and tariffs","Pricing transparency, duration limits, and bans on aggressive targeting patterns (dark patterns)","Military procurement regulations","Agricultural subsidies compliance"],a:1,e:"Freemium faces risks around dark patterns, lack of pricing transparency, and aggressive upselling — all regulated under EU consumer and digital law."},
{t:"Digital Markets",b:"bs0",q:"In the Online Advertising model, platforms monetize by:",o:["Charging subscription fees","Selling physical products","Selling highly targeted, real-time personalized ad spaces to corporate buyers","Licensing their source code"],a:2,e:"Online advertising platforms (Google, Facebook) monetize by selling highly targeted, real-time ad spaces — the user's data is the product."},
{t:"Digital Markets",b:"bs0",q:"In a SaaS model, the vendor handles:",o:["Physical retail store operations","Hosting, cybersecurity, and software updates","Manufacturing of hardware","Hiring of the client's employees"],a:1,e:"In SaaS, the vendor manages hosting, security, and updates — the client just uses the software via the internet."},
{t:"Digital Markets",b:"bs0",q:"Smart Contracts in the Tokenization model are:",o:["Traditional paper contracts digitized via scanning","Self-executing, automated code blocks that trigger performance when predetermined conditions are verified","Contracts reviewed by human lawyers only","Government-issued regulatory documents"],a:1,e:"Smart contracts: self-executing code on a blockchain that automatically performs agreed actions when predefined conditions are met."},
{t:"Digital Markets",b:"bs0",q:"The Digital Ecosystem model benefits from:",o:["Low user engagement","Network economies; the goal is to trap users inside the ecosystem","Selling single-use products","Operating without any partnerships"],a:1,e:"Digital ecosystems (Apple, Google) leverage network economies and create lock-in — keeping users inside their interconnected services."},
{t:"Digital Markets",b:"bs0",q:"Open Source licenses include:",o:["Franchise Agreements","MIT and GNU GPL","SaaS Usage Agreements","Distance Sales Contracts"],a:1,e:"MIT and GNU GPL are the most common open-source licenses. MIT is permissive; GNU GPL is copyleft (derivatives must also be open source)."},
// ── SECTION 1: INFORMATION SOCIETY & TELECOMMUNICATIONS ──────────────────────
{t:"Info Society",b:"bs1",q:"Data is classified as intangible property because:",o:["It has a physical body","It does not have a physical body, even if stored on physical devices","It cannot be transferred between servers","It is always stored on paper"],a:1,e:"Data is intangible — no physical body itself, even if it resides on physical storage devices."},
{t:"Info Society",b:"bs1",q:'Digital data is described as "non-rivalrous" because:',o:["It can only be used by one person at a time","It can be replicated and used by multiple parties simultaneously without being consumed","It is always scarce","It cannot be copied"],a:1,e:"Non-rivalrous: data can be used by multiple parties simultaneously without being depleted — unlike physical goods."},
{t:"Info Society",b:"bs1",q:'The "Principle of Publicity" states that:',o:["All government information must remain secret","All information held by public entities is publicly accessible; secrecy is exceptional","Private companies must publish their financial data","Individuals must share personal information publicly"],a:1,e:"Principle of Publicity: all information held by public entities should be accessible to citizens — secrecy is the exception."},
{t:"Info Society",b:"bs1",q:"Limits to the Principle of Publicity include:",o:["Corporate marketing plans","Personal data, national security, and trade secrets","Sports event schedules","Public holiday calendars"],a:1,e:"The Principle of Publicity has limits: personal data (privacy), national security, and trade secrets are protected from public disclosure."},
{t:"Info Society",b:"bs1",q:"The Principle of Secrecy or Reserve applies to:",o:["All government information by default","Information whose disclosure may affect public or private interests","Only military data","Information about public holidays"],a:1,e:"Principle of Secrecy applies to information whose disclosure could damage public or private interests — national security, personal data, business secrets."},
{t:"Info Society",b:"bs1",q:"Which of the following is NOT one of the five digital properties of data?",o:["Dematerialization and network support","Metadata","Physical weight and mass","Decentralized governance"],a:2,e:"The five digital properties: dematerialization, non-rivalrous nature, metadata, network support, decentralized governance. Physical weight/mass is NOT one of them."},
{t:"Info Society",b:"bs1",q:"Metadata enables:",o:["Physical transportation of data","Contextualization, author/date identification, and traceability","Destruction of data","Encryption of all communications"],a:1,e:"Metadata (data about data) enables contextualization, traceability, and management of digital content."},
{t:"Info Society",b:"bs1",q:"Freedom of speech protects:",o:["The free dissemination of fake facts","The free dissemination of thoughts, ideas, and opinions (non-fake facts)","The right to commit defamation","Unlimited commercial advertising"],a:1,e:"Freedom of speech protects thoughts, ideas, and opinions — but NOT fake facts (disinformation) or defamatory statements."},
{t:"Info Society",b:"bs1",q:"The Right to Intimacy/Privacy is:",o:["An extension of the Principle of Publicity","An exception to the Principle of Publicity, protecting private and family life","Only applicable to public officials","A right that can be waived by contract"],a:1,e:"The Right to Privacy is an exception to the Principle of Publicity — it protects private and family life from unwanted public disclosure."},
{t:"Info Society",b:"bs1",q:"The Right to be Forgotten is directly linked to:",o:["The Right to Free Speech","The Right to Erasure","The Right to Vote","The Right to Education"],a:1,e:"The Right to be Forgotten (Art. 17 GDPR) is directly linked to the Right to Erasure — allowing individuals to request deletion of personal data."},
{t:"Info Society",b:"bs1",q:"The Electromagnetic Spectrum is classified as:",o:["Private property of broadcasters","A public good (limited physical resource)","Intellectual property of the government","An unlimited resource"],a:1,e:"The electromagnetic spectrum is a limited natural resource classified as a public good — must be allocated and managed by government authorities."},
{t:"Info Society",b:"bs1",q:"ICANN manages:",o:["European cinema regulations","Global standardization of IP addresses and Top-Level Domain names (TLDs)","EU tax policy","Spanish consumer protection"],a:1,e:"ICANN manages the global system of IP address allocation and Top-Level Domain names (e.g., .com, .org)."},
{t:"Info Society",b:"bs1",q:'The country-code Top-Level Domain ".es" in Spain is delegated to:',o:["ICANN directly","The Public Business Entity Red.es","The Spanish Ministry of Defence","Telefonica"],a:1,e:"ICANN delegates the .es TLD to Red.es, a Spanish public business entity under the Ministry of Economic Affairs."},
{t:"Info Society",b:"bs1",q:"Law 34/2002 (LSSI) applies to:",o:["Only service providers outside Spain","Service providers established in Spain AND foreign providers targeted to the Spanish market","Only physical retail stores","Only telecommunications companies"],a:1,e:"LSSI applies to all providers established in Spain, plus foreign providers specifically targeting the Spanish market."},
{t:"Info Society",b:"bs1",q:"The Television Without Frontiers Directive (89/552/EEC) was:",o:["A regulation about internet governance","The first major European harmonization directive ensuring free movement of television broadcasts","A law banning all foreign films in Europe","A directive about radio frequency allocation"],a:1,e:"The 'Television Without Frontiers' Directive (89/552/EEC) was the first major EU directive harmonizing television broadcasting across member states."},
{t:"Info Society",b:"bs1",q:"Screen Quotas in Europe mandate that:",o:["All movies must be in English","Movie theatres reserve a minimum percentage of screening days for European cinematic productions","American films are banned","Only government-funded films can be shown"],a:1,e:"European screen quotas require cinemas to reserve a minimum percentage of screening days for European productions — protecting cultural diversity."},
{t:"Info Society",b:"bs1",q:"In written press, criminal liability follows a cascade model where:",o:["The reader is liable first","If the author is not identified, the director is responsible; if unavailable, the publisher","Only the printing company is ever liable","No one is ever liable"],a:1,e:"Press liability cascade: author → (if unknown) director → (if unavailable) publisher. Someone is always accountable."},
{t:"Info Society",b:"bs1",q:'The evolution of data management in the "Digitalisation era" is characterized by:',o:["High CAPEX dependence and limited markets","Low CAPEX dependence, OPEX concentration, and global markets","No operational costs","Exclusively physical data storage"],a:1,e:"The Digitalisation era: low CAPEX, concentration of operational costs (OPEX), cloud infrastructure, and access to global markets."},
// ── SECTION 2: PERSONAL DATA PROTECTION ─────────────────────────────────────
{t:"Data Protection",b:"bs2",q:"Personal data is defined as:",o:["Any information about a company","Information relating to a person that can be traced back to an individual","Only financial records","Only biometric information"],a:1,e:"Personal data: any information relating to an identified or identifiable natural person (Art. 4(1) GDPR)."},
{t:"Data Protection",b:"bs2",q:"Which of the following is considered sensitive personal data?",o:["Address","Credit record","Sexual orientation","Voice and image"],a:2,e:"Sexual orientation is a special category (Art. 9 GDPR) requiring heightened protection. Address, credit records, and voice/image are ordinary personal data."},
{t:"Data Protection",b:"bs2",q:"Which of the following is NOT sensitive personal data?",o:["Ideology","Biometric information","Labour record","Genetic information"],a:2,e:"Labour records (employment history) are ordinary personal data — not Art. 9 special categories. Ideology, biometrics, and genetic data ARE sensitive."},
{t:"Data Protection",b:"bs2",q:'A "Controller" in data protection is:',o:["The person whose data is being processed","The entity that determines the purpose of the processing of personal data","A third-party auditor","The government ministry overseeing privacy"],a:1,e:"The controller determines the purposes and means of processing personal data — they decide WHY and HOW data is processed (Art. 4(7) GDPR)."},
{t:"Data Protection",b:"bs2",q:'A "Processor" in data protection:',o:["Determines the purpose of data processing","Processes personal data strictly on behalf of the controller","Is the data subject themselves","Is the supervisory authority"],a:1,e:"A processor processes data strictly on behalf of, and under instructions of, the controller — they don't decide the purpose (Art. 4(8) GDPR)."},
{t:"Data Protection",b:"bs2",q:"Under the GDPR, consent must be:",o:["Implied from silence","Freely given, specific, informed, and unambiguous","Only verbal","Given once and never withdrawn"],a:1,e:"GDPR consent must be freely given, specific, informed, and unambiguous (Art. 4(11)). Silence or pre-ticked boxes do NOT constitute valid consent."},
{t:"Data Protection",b:"bs2",q:"The GDPR defines pseudonymisation as:",o:["Complete anonymization of data","Processing of personal data that can no longer be attributed to a specific person without additional information","Encrypting data with military-grade algorithms","Deleting all personal data"],a:1,e:"Pseudonymisation replaces identifying info with pseudonyms — data can still be re-identified with additional info, unlike true anonymization (Art. 4(5) GDPR)."},
{t:"Data Protection",b:"bs2",q:"Data minimization under the GDPR means:",o:["Collecting as much data as possible for future use","Reducing data to its minimal required revelation and manipulation","Only processing data on Mondays","Storing data indefinitely"],a:1,e:"Data minimization (Art. 5(1)(c)): collect only data adequate, relevant, and limited to what is necessary for the specified purpose."},
{t:"Data Protection",b:"bs2",q:"Storage limitation under the GDPR means:",o:["Data can be stored forever","Data kept in a form that allows identification of the user for no longer than necessary","Data must be stored for a minimum of 100 years","There are no limits on storage duration"],a:1,e:"Storage limitation (Art. 5(1)(e)): personal data must not be kept in identifiable form longer than necessary for the processing purpose."},
{t:"Data Protection",b:"bs2",q:"The GDPR does NOT apply to:",o:["Online shopping platforms processing EU data","A natural person during a purely personal or household activity","Banks operating in the EU","Hospitals in EU member states"],a:1,e:"GDPR explicitly excludes purely personal or household activities (Art. 2(2)(c)) — e.g., a personal address book or family photo sharing."},
{t:"Data Protection",b:"bs2",q:"The Establishment Criterion of the GDPR's territorial scope means it applies when:",o:["The data subject is outside the EU","Processing takes place in the context of activities of a controller/processor located inside the EU","The company has no EU presence","Data is processed only for military purposes"],a:1,e:"Establishment Criterion (Art. 3(1)): GDPR applies if a controller/processor is established in the EU and processing relates to their EU establishment's activities."},
{t:"Data Protection",b:"bs2",q:"The Targeting Criterion of the GDPR means it applies to non-EU entities when they:",o:["Only process data about other non-EU individuals","Process data of individuals physically located inside the EU (offering goods or monitoring behaviour)","Have fewer than 10 employees","Are nonprofit organizations"],a:1,e:"Targeting Criterion (Art. 3(2)): GDPR applies to non-EU controllers when they offer goods/services to EU data subjects or monitor their behaviour."},
{t:"Data Protection",b:"bs2",q:"The Right of Rectification allows data subjects to:",o:["Delete all their data permanently","Obtain from the controller without delay the rectification of inaccurate personal data","Transfer data to another country","Object to all processing"],a:1,e:"Art. 16 GDPR — Right to Rectification: have inaccurate personal data corrected without undue delay."},
{t:"Data Protection",b:"bs2",q:"The Right to Erasure does NOT apply when data is necessary for:",o:["Commercial marketing purposes","Public interest, legal claims, or freedom of expression","Internal company reports","Social media engagement metrics"],a:1,e:"Art. 17 GDPR — exceptions to erasure: public interest tasks, legal claims, or exercise of freedom of expression."},
{t:"Data Protection",b:"bs2",q:"The Right to Data Portability allows individuals to:",o:["Have their data deleted","Receive their personal data in a structured format and transmit it to another controller","Object to all data processing","Sue the data controller for damages"],a:1,e:"Art. 20 GDPR — Data Portability: receive personal data in machine-readable format and transfer it to another controller."},
{t:"Data Protection",b:"bs2",q:"If an individual objects to processing for direct marketing purposes:",o:["The controller may continue after a 30-day delay","The controller must stop processing for that purpose","The data subject must pay a fee","The objection is only advisory"],a:1,e:"Art. 21(3) GDPR: when an individual objects to direct marketing, the controller MUST immediately cease processing for that purpose."},
{t:"Data Protection",b:"bs2",q:"Restrictions to data protection rights can be justified by:",o:["Commercial convenience","National security, defence, public safety, and criminal investigations","Company profitability goals","Marketing department requests"],a:1,e:"Art. 23 GDPR allows member states to restrict data protection rights to safeguard national security, defence, public safety, and prevention/investigation of crime."},
{t:"Data Protection",b:"bs2",q:"The Right to Restriction of Processing applies when:",o:["The data subject wants faster processing","Accuracy of data is contested, processing is unlawful but user requests restriction instead of erasure, or data is unnecessary but needed for legal claims","The controller wants to sell the data","The processor requests it for efficiency"],a:1,e:"Art. 18 GDPR — Restriction applies: contested accuracy, unlawful processing (erasure refused), legal claims, or pending verification of legitimate grounds."},
// ── SECTION 3: INFORMATION SOCIETY SERVICES ──────────────────────────────────
{t:"E-Commerce",b:"bs3",q:"E-commerce is defined as:",o:["Only physical retail transactions","The conduct of commercial transactions for purchase and sale of goods/services through electronic networks","Government procurement activities","Barter transactions between individuals"],a:1,e:"E-commerce: commercial transactions (buying/selling goods/services) through electronic networks — B2C, B2B, and B2G."},
{t:"E-Commerce",b:"bs3",q:"The Principle of Freedom for Information Society services means:",o:["All services require prior government authorization","Creation, provision, or consumption of services shall not be subject to prior authorization (with exceptions)","Only government entities can provide online services","Services must be free of charge"],a:1,e:"Principle of Freedom: no prior authorization needed to provide/consume Information Society services (with narrow exceptions)."},
{t:"E-Commerce",b:"bs3",q:"Exceptions to the Principle of Freedom include:",o:["Marketing strategy preferences","Public order, consumer protection, protection of minors, and intellectual property","Corporate branding requirements","Shareholder approval requirements"],a:1,e:"Exceptions to the Principle of Freedom: public order, national security, consumer protection, protection of minors, and intellectual property rights."},
{t:"E-Commerce",b:"bs3",q:"An e-contract possesses:",o:["No legal validity","Full legal validity when essential regulatory elements are met","Validity only if printed on paper","Validity only for transactions under 100 euros"],a:1,e:"E-contracts have full legal validity when they meet the essential elements of any contract (offer, acceptance, consideration) plus e-commerce requirements."},
{t:"E-Commerce",b:"bs3",q:"E-contracts are primarily governed by:",o:["Only the Spanish Criminal Code","Law 34/2002 (LSSI), Spanish Civil Code, Commercial Code, and consumer protection statutes","Only EU regulations","Only international trade agreements"],a:1,e:"E-contracts in Spain: LSSI (Law 34/2002) for e-commerce rules, Civil/Commercial Code for contract fundamentals, consumer protection for B2C."},
{t:"E-Commerce",b:"bs3",q:"Which areas are excluded from e-contracting?",o:["Commercial transactions","Family Law, Succession Law, and matters requiring public authority intervention","Consumer purchases","Software licensing"],a:1,e:"E-contracting excludes: Family Law, Succession Law, and contracts requiring notarial or public authority intervention."},
{t:"E-Commerce",b:"bs3",q:"B2C relationships are governed by:",o:["Only the Civil Code","The Commercial Code plus consumer protection rules","Only the Public Sector Contracts Act","Only international trade law"],a:1,e:"B2C e-commerce: Commercial Code plus mandatory consumer protection rules — consumers get stronger protections than businesses."},
{t:"E-Commerce",b:"bs3",q:"B2G (Business to Government) relationships are regulated by:",o:["Only the Civil Code","The Public Sector Contracts Act (LCSP) and commercial rules","Only consumer protection rules","Only EU directives"],a:1,e:"B2G procurement: LCSP (Ley de Contratos del Sector Público) — strict procurement rules ensuring transparency and competition."},
{t:"E-Commerce",b:"bs3",q:"Cross-border e-commerce disputes within the EU are governed by:",o:["Each country's national law exclusively","Regulation (EU) 1215/2012 (Brussels I bis)","ICANN arbitration","The United Nations Convention"],a:1,e:"Cross-border EU disputes: Brussels I bis (Regulation 1215/2012) establishes jurisdiction rules for civil and commercial matters."},
{t:"E-Commerce",b:"bs3",q:"Under the Consumer Exception in B2C disputes, consumers can sue:",o:["Only in the seller's country","In the courts of their own Member State of residence or where goods were delivered","Only at the European Court of Justice","Only through arbitration"],a:1,e:"Brussels I bis Art. 18: consumers can sue in their home country or where goods were delivered — protecting them from litigating abroad."},
{t:"E-Commerce",b:"bs3",q:"Unjustified geo-blocking is prohibited under:",o:["The GDPR","Regulation EU 2018/302","The Television Without Frontiers Directive","HIPAA"],a:1,e:"Regulation (EU) 2018/302 prohibits unjustified blocking or restriction of access to goods/services based on a customer's nationality or location within the EU."},
{t:"E-Commerce",b:"bs3",q:"In the Inditex tax case, Ireland's Corporate Tax Rate was approximately:",o:["25-30%","12.5%","0%","50%"],a:1,e:"Ireland's ~12.5% corporate tax rate was key in the Inditex tax optimization case — multinationals routed profits through Ireland to benefit from the low rate."},
{t:"E-Commerce",b:"bs3",q:"In the Apple State Aid case, the EU ordered Apple to repay approximately:",o:["1 billion euros","13 billion euros","100 million euros","50 billion euros"],a:1,e:"The EU Commission ordered Apple to repay ~€13 billion in illegal state aid to Ireland — Ireland had granted Apple preferential tax treatment."},
{t:"E-Commerce",b:"bs3",q:"In Spain, consumer protection is primarily governed by:",o:["The Spanish Criminal Code","Royal Legislative Decree 1/2007","Law 34/2002 (LSSI)","The EU AI Act"],a:1,e:"Royal Legislative Decree 1/2007 (TRLGDCU) is the main Spanish consumer protection statute — the General Law for the Defence of Consumers and Users."},
{t:"E-Commerce",b:"bs3",q:'A "vulnerable consumer" is defined as:',o:["Any consumer under age 30","An individual in a position of defencelessness preventing them from exercising consumer rights on an equal footing","A consumer who buys luxury goods","A consumer who shops online exclusively"],a:1,e:"A vulnerable consumer: someone in a position of particular vulnerability (age, disability, economic situation) that prevents them from fully exercising consumer rights on equal terms."},
{t:"E-Commerce",b:"bs3",q:"Consumer rights are:",o:["Waivable by contract","Non-waivable and prevail over contractual freedom","Only advisory guidelines","Only applicable to transactions above 500 euros"],a:1,e:"Consumer rights are mandatory — cannot be waived by contract. Any contractual clause reducing consumer rights below the legal minimum is null and void."},
{t:"E-Commerce",b:"bs3",q:"The Right of Withdrawal period for consumers in distance contracts is:",o:["7 days","14 days","30 days","60 days"],a:1,e:"Under the EU Consumer Rights Directive, consumers have 14 calendar days to withdraw from a distance or off-premises contract without giving any reason."},
{t:"E-Commerce",b:"bs3",q:"Legal guarantees for goods cover:",o:["1 year","3 years","5 years","10 years"],a:1,e:"Under the EU Sale of Goods Directive (transposed into Spanish law), the legal guarantee period for goods is 3 years from delivery."},
{t:"E-Commerce",b:"bs3",q:"Digital payment services are regulated under:",o:["The GDPR","Directive (EU) 2015/2366 (PSD2)","The EU AI Act","The Television Without Frontiers Directive"],a:1,e:"Digital payment services across the EU are regulated by PSD2 — the Revised Payment Services Directive (2015/2366)."},
{t:"E-Commerce",b:"bs3",q:"Low-Value Payment Instruments handle individual transactions of less than:",o:["10 euros","30 euros","100 euros","500 euros"],a:1,e:"Under PSD2, Low-Value Payment Instruments (LVPI) handle individual transactions of less than €30, benefiting from reduced compliance requirements."},
{t:"E-Commerce",b:"bs3",q:"The maximum stored value capacity for low-value payment instruments is below:",o:["50 euros","150 euros","500 euros","1000 euros"],a:1,e:"PSD2: low-value payment instruments have a maximum stored value of €150 and individual transactions below €30."},
{t:"E-Commerce",b:"bs3",q:"To amend a Framework Agreement, the service provider must give the user minimum notice of:",o:["1 month","2 months","6 months","1 year"],a:1,e:"Under PSD2, a payment service provider must give users at least 2 months' notice before changes to a Framework Agreement."},
{t:"E-Commerce",b:"bs3",q:"Once a payment is authorized and received, it is:",o:["Revocable within 7 days","Irrevocable (with specific exceptions for card payments and direct debits)","Always refundable","Subject to a 30-day cooling period"],a:1,e:"Under PSD2, once a payment is authorized and received, it is generally irrevocable. Exceptions exist for card payments and SEPA direct debits under specific conditions."},
{t:"E-Commerce",b:"bs3",q:"A Consumer Arbitration System is:",o:["A court proceeding","An extrajudicial mechanism for resolving disputes, with binding and enforceable decisions","A voluntary, non-binding mediation","A government regulatory body"],a:1,e:"Consumer arbitration: extrajudicial (out-of-court) dispute resolution with binding, enforceable decisions — an alternative to litigation."},
{t:"E-Commerce",b:"bs3",q:"Abusive clauses in consumer contracts are:",o:["Always enforceable","Not binding on the consumer","Only invalid if the contract exceeds 1000 euros","Valid if the consumer signed the contract"],a:1,e:"Under EU and Spanish consumer law, abusive clauses are not binding on the consumer — even if the consumer signed. The clause is null and void by law."},
// ── SECTION 4: ARTIFICIAL INTELLIGENCE ACT ───────────────────────────────────
{t:"AI Act",b:"bs4",q:"The EU's approach to AI regulation is based on:",o:["Complete deregulation","A risk-based approach with different levels of prohibition","A state-directed approach where the government decides everything","Applying only existing legislation without new rules"],a:1,e:"The EU AI Act (2024) uses a risk-based approach: Unacceptable, High, Limited, and Minimal risk — each with different obligations."},
{t:"AI Act",b:"bs4",q:'Which country/region follows a "decentralized sectoral model" for AI regulation?',o:["EU","Singapore and Japan","China","USA"],a:1,e:"Singapore and Japan follow a decentralized, sectoral approach — each sector develops its own AI guidelines rather than one overarching AI law."},
{t:"AI Act",b:"bs4",q:'Which country/region follows a "state directed approach" to AI?',o:["EU","USA","China","Singapore"],a:2,e:"China follows a state-directed approach — the government actively directs and controls AI development through mandates and national strategies."},
{t:"AI Act",b:"bs4",q:"The USA's approach to AI regulation is primarily to:",o:["Create entirely new AI-specific legislation","Apply current legislation and adapt it to AI","Completely ban AI","Follow the EU model exactly"],a:1,e:"The USA primarily adapts existing laws (consumer protection, civil rights, privacy) to AI — a sectoral, non-prescriptive approach."},
{t:"AI Act",b:"bs4",q:'The "Reserve of humanity principle" in EU AI regulation means:',o:["AI systems should operate fully autonomously","Human beings must control the system and have the final decision in important matters","AI must replace all human decision-making","Only robots should make legal decisions"],a:1,e:"Reserve of Humanity: humans must retain control over AI systems and have the final decision in significant matters — AI assists but doesn't replace human judgment."},
{t:"AI Act",b:"bs4",q:'Which of the following is classified as "Unacceptable Risk" and banned in the EU?',o:["Spam filters","Social Scoring by governments evaluating citizens based on social behaviour","Weather prediction AI","Video game mechanics AI"],a:1,e:"Social Scoring by governments (e.g., China-style social credit systems) is Unacceptable Risk — banned under the EU AI Act as it violates fundamental rights."},
{t:"AI Act",b:"bs4",q:"Real-Time Biometric Identification (RBI) in publicly accessible spaces is classified as:",o:["Minimal risk","Unacceptable risk (banned)","Limited risk","High risk"],a:1,e:"Real-Time Biometric Identification in public spaces is generally Unacceptable Risk (banned) under the EU AI Act, with very narrow law enforcement exceptions."},
{t:"AI Act",b:"bs4",q:"Predictive policing based solely on profiling is classified under the EU AI Act as:",o:["High risk","Unacceptable risk (banned)","Limited risk","Minimal risk"],a:1,e:"Predictive policing based solely on profiling is banned (Unacceptable Risk) — it violates the presumption of innocence and fundamental rights."},
{t:"AI Act",b:"bs4",q:"Emotion Recognition AI deployed in workplaces is classified as:",o:["Minimal risk","Unacceptable risk (banned)","High risk with strict obligations","Limited risk with transparency requirements"],a:1,e:"Emotion recognition AI in workplaces and educational institutions is Unacceptable Risk (banned) under the EU AI Act — poses unacceptable risks to workers' rights."},
{t:"AI Act",b:"bs4",q:"An AI system is classified as high-risk if:",o:["It generates video content","It serves as a safety component in an EU-regulated product OR falls under specific critical categories in the Act's annexes","It filters spam emails","It plays chess"],a:1,e:"High-risk AI: safety components in EU-regulated products (e.g., medical devices, cars) OR fall under specific critical categories in Annexes I and III of the AI Act."},
{t:"AI Act",b:"bs4",q:"High-risk AI providers must:",o:["Only inform users verbally","Perform a Pre-Market Conformity Assessment and register in the European Commission database","Simply declare the AI is safe","Only comply with national laws"],a:1,e:"High-risk AI providers must conduct a Pre-Market Conformity Assessment, establish a quality management system, and register in the EU database before market deployment."},
{t:"AI Act",b:"bs4",q:"Limited risk AI systems require:",o:["Complete prohibition","Informational transparency measures (disclosing AI-generated content)","Pre-market audits","No obligations whatsoever"],a:1,e:"Limited risk AI (e.g., chatbots, deepfakes) requires informational transparency — users must be told they are interacting with AI or viewing AI-generated content."},
{t:"AI Act",b:"bs4",q:"Spam filters and video-game AI mechanics are examples of:",o:["High-risk AI","Minimal risk AI (zero obligations)","Unacceptable risk AI","Limited risk AI"],a:1,e:"Spam filters and video-game AI are Minimal Risk — negligible risks, zero mandatory obligations under the EU AI Act."},
{t:"AI Act",b:"bs4",q:"The European AI Office operates:",o:["At the national level only","At the centralized EU level within the European Commission, with power over General-Purpose AI models","Only in Germany","As a private consulting firm"],a:1,e:"The European AI Office operates at EU level within the European Commission — oversees General-Purpose AI (GPAI) models and supports AI Act implementation."},
{t:"AI Act",b:"bs4",q:"Notified Bodies under the EU AI Act are:",o:["EU member state parliaments","Third-party auditing organizations responsible for pre-market assessments for high-risk systems","Political advisory committees","Consumer advocacy groups"],a:1,e:"Notified Bodies are accredited third-party organizations that conduct conformity assessments for high-risk AI systems before market placement."},
{t:"AI Act",b:"bs4",q:"The maximum penalty under the EU AI Act can reach:",o:["10 million euros or 2% of turnover","35 million euros or 7% of global annual turnover","20 million euros or 4% of turnover","1 million euros or 1% of turnover"],a:1,e:"Maximum fine: €35 million or 7% of global annual turnover (for prohibited AI practices) — higher than GDPR's maximum of €20 million/4%."},
{t:"AI Act",b:"bs4",q:"Deployers of AI systems that generate or manipulate image/audio/video content must:",o:["Do nothing","Disclose that the content has been artificially generated","Pay a special tax","Register with ICANN"],a:1,e:"Deployers of AI-generated or manipulated image/audio/video (deepfakes) must disclose that the content has been artificially created or manipulated."},
{t:"AI Act",b:"bs4",q:"Subliminal or manipulative AI systems that alter human behaviour are classified as:",o:["Limited risk","Unacceptable risk (banned)","High risk","Minimal risk"],a:1,e:"AI using subliminal techniques or exploiting psychological vulnerabilities to manipulate behaviour is Unacceptable Risk — banned under the EU AI Act."},
// ── SECTION 5: INTELLECTUAL & INDUSTRIAL PROPERTY ────────────────────────────
{t:"IP Law",b:"bs5",q:"Moral rights of authors are:",o:["Waivable and transferable","Non-waivable and inalienable","Only valid during the author's lifetime","Only applicable to digital works"],a:1,e:"Moral rights (paternity, integrity, disclosure) are non-waivable and inalienable — they cannot be transferred or waived by contract."},
{t:"IP Law",b:"bs5",q:"Economic rights (exploitation rights) under the LPI include:",o:["Right to paternity and integrity","Reproduction, distribution, public communication, and transformation","Right to vote and right to education","Right to privacy and right to honour"],a:1,e:"Economic (exploitation) rights under the Spanish LPI: reproduction, distribution, public communication, and transformation — these can be transferred and licensed."},
{t:"IP Law",b:"bs5",q:"The duration of economic rights after an author's death is:",o:["50 years","70 years","100 years","Perpetual"],a:1,e:"LPI Art. 26: economic rights last the author's lifetime plus 70 years after death — harmonized across the EU by Directive 2006/116/EC."},
{t:"IP Law",b:"bs5",q:"If the author is anonymous, economic rights last:",o:["50 years from the author's death","70 years from the date the work is disclosed to the public","100 years from creation","Indefinitely"],a:1,e:"For anonymous/pseudonymous works where the author cannot be identified, economic rights last 70 years from the date the work is first lawfully disclosed."},
{t:"IP Law",b:"bs5",q:"Which of the following is NOT a type of protected work under intellectual property?",o:["Software","Databases","Mathematical formulas (as such)","Cinematographic works"],a:2,e:"Mathematical formulas as such are NOT protected by copyright — part of the public domain of human knowledge. Software, databases, and films ARE protected."},
{t:"IP Law",b:"bs5",q:"Non-human production or recreation:",o:["Is fully protected under intellectual property law","Is not protected under intellectual property law","Is only protected if registered","Has the same protections as human-created works"],a:1,e:"IP law requires human authorship — AI-generated works without human creative input are NOT protected under intellectual property law (current EU/Spanish law)."},
{t:"IP Law",b:"bs5",q:'"Inter Vivos" transmission of intellectual property rights covers:',o:["Both moral and economic rights","Only economic rights via contract","Only moral rights","Neither moral nor economic rights"],a:1,e:"Inter Vivos transmission covers only economic rights — moral rights are personal and inalienable and cannot be transferred between living persons."},
{t:"IP Law",b:"bs5",q:'"Mortis Causa" transmission passes:',o:["Only economic rights to heirs","Ownership to heirs to enforce integrity and paternity (moral rights protections)","No rights at all","Rights to the government"],a:1,e:"Mortis Causa (by inheritance) passes economic rights to heirs. Additionally, heirs can exercise certain moral rights (integrity and paternity) on behalf of the deceased author."},
{t:"IP Law",b:"bs5",q:"Patents grant an exclusive monopoly for a fixed period of:",o:["10 years","20 years","50 years","70 years"],a:1,e:"A patent grants a 20-year exclusive monopoly in exchange for public disclosure of the invention (Art. 49 Spanish Patent Law; Art. 63 EPC)."},
{t:"IP Law",b:"bs5",q:"Which of the following is NOT a requirement for a patent?",o:["Novelty","Inventive activity","Aesthetic beauty","Industrial applicability"],a:2,e:"Patent requirements: novelty, inventive step (non-obvious), and industrial applicability. Aesthetic beauty is NOT a patent requirement."},
{t:"IP Law",b:"bs5",q:"Which of the following is excluded from patentability?",o:["Chemical compounds","Software (as such), mathematical methods, aesthetic creations, plants, humans","Mechanical devices","Pharmaceutical formulations"],a:1,e:"Excluded from patentability: software as such, mathematical methods, aesthetic creations, plant varieties, animal breeds, and humans (Art. 52 EPC)."},
{t:"IP Law",b:"bs5",q:"Trademarks are granted for:",o:["10 years and renewed","25 years and renewed","50 years without renewal","70 years after the creator's death"],a:1,e:"Per the course materials, trademarks are granted for 25 years and are renewable indefinitely — ensuring continuous brand protection."},
{t:"IP Law",b:"bs5",q:"Origin denominations protect:",o:["Any brand name regardless of geography","Products whose reputation or quality stems from a specific geographical area","Only digital products","Only exported goods"],a:1,e:"Designations of Origin (e.g., Rioja wine, Manchego cheese) protect products whose quality or reputation is essentially due to a specific geographical area."},
{t:"IP Law",b:"bs5",q:"Industrial property strictly requires:",o:["Verbal declaration only","Registration in an official office","Publication in a newspaper","Approval by a university"],a:1,e:"Industrial property rights (patents, trademarks, designs) are constitutive — they only arise upon formal registration in the competent official office (e.g., OEPM in Spain)."},
{t:"IP Law",b:"bs5",q:"The Spanish Intellectual Property Law (LPI) was approved by:",o:["Law 34/2002","Royal Legislative Decree 1/1996","Royal Legislative Decree 1/2007","Directive 89/552/EEC"],a:1,e:"The Spanish LPI was approved by Royal Legislative Decree 1/1996, consolidating previous copyright legislation into a unified text."},
{t:"IP Law",b:"bs5",q:"The Right of Reproduction in intellectual property refers to:",o:["The right to sell or rent works","Control and remuneration of copies","Public performance rights","Translation rights"],a:1,e:"Right of Reproduction (Art. 18 LPI): the right to make and control copies of the work — including digital reproduction."},
{t:"IP Law",b:"bs5",q:"Public Communication in intellectual property means:",o:["Distributing physical copies","Access to the work by the public without distributing physical copies","Private display to the author only","Government censorship review"],a:1,e:"Public Communication (Art. 20 LPI): making a work accessible to the public without transferring physical copies — e.g., broadcasting, streaming, public performance."},
// ── SECTION 6: ONLINE CRIMINAL & PUNITIVE LAW ────────────────────────────────
{t:"Criminal Law",b:"bs6",q:"Cracking refers to:",o:["Violating privacy of data","Severe damage to a computer system, infrastructure, or software","Promoting discrimination online","Fraudulent profit through device manipulation"],a:1,e:"Cracking involves causing severe damage to computer systems or software — unauthorized modification, destruction, or sabotage of infrastructure."},
{t:"Criminal Law",b:"bs6",q:"Hacking, in this legal context, refers to:",o:["Severe system destruction","Violating the privacy of data","Business secrets theft","Promoting terrorism"],a:1,e:"In this legal context, hacking refers to unauthorized access to systems to violate the privacy of data — distinct from cracking (system damage)."},
{t:"Criminal Law",b:"bs6",q:"Computer fraud involves:",o:["Building websites","Profiting by manipulating a computer or device to commit fraud","Unauthorized photography","Writing open-source software"],a:1,e:"Computer fraud (Art. 248 Penal Code): using computer manipulation to obtain fraudulent economic benefit — altering data or processes to deceive systems."},
{t:"Criminal Law",b:"bs6",q:"Business secrets revelation (Art. 278) involves:",o:["Publishing academic research","Taking possession of data to discover business secrets","Filing a patent application","Sending marketing emails"],a:1,e:"Art. 278 Spanish Penal Code: taking possession of data, documents, or objects to discover and disclose a company's trade secrets."},
{t:"Criminal Law",b:"bs6",q:"The elements of criminal liability include:",o:["Only financial damages","Conduct (act and omission), principle of legality, protected legal interest, and subjective liability (culpability)","Only intent","Only negligence"],a:1,e:"Criminal liability requires: (1) conduct (act/omission), (2) principle of legality, (3) protected legal interest, and (4) culpability (intent or negligence)."},
// ── MIXED / CROSS-CUTTING QUESTIONS ──────────────────────────────────────────
{t:"Mixed",b:"bsm",q:"The GDPR is formally identified as:",o:["Directive (EU) 2015/2366","Regulation (EU) 2016/679","Law 34/2002","Royal Legislative Decree 1/2007"],a:1,e:"The GDPR is formally Regulation (EU) 2016/679 — a directly applicable regulation (not a directive) on personal data protection."},
{t:"Mixed",b:"bsm",q:"Which type of state system has regional levels of government below the national level?",o:["Confederation systems","Federal systems","Regional systems","Unitary systems"],a:2,e:"Regional systems have an intermediate level of government (regions/autonomous communities) below the national level — like Spain's Autonomous Communities."},
{t:"Mixed",b:"bsm",q:"Systematic Interpretation requires:",o:["Interpreting rules based on their historical origin","Construing each clause in harmony with the legal system","Applying the most recent law only","Ignoring constitutional provisions"],a:1,e:"Systematic Interpretation: interpret each legal provision in harmony with the entire legal system — ensuring coherence with other norms, principles, and the Constitution."},
{t:"Mixed",b:"bsm",q:"In Taylorism (Scientific Management), the key dilemma for data management was:",o:["Lack of electricity","Global or local laws applying to internationalized operations","Absence of written language","No available storage media"],a:1,e:"In the Taylorism era, the key legal dilemma for multinational data management was whether global or local laws should apply to internationalized operations."},
{t:"Mixed",b:"bsm",q:'"Profiling risk" in data management refers to:',o:["Creating social media profiles","Citizens being categorized in an automated profile, limiting their options","Job applicant screening","Product quality testing"],a:1,e:"Profiling risk: automated processing creates profiles that categorize individuals and limit their options — e.g., credit scoring, targeted advertising, predictive policing."},
{t:"Mixed",b:"bsm",q:'The cinema industry benefits from the "Cultural Diversity Exception" under:',o:["EU Data Protection Law","WTO rules, allowing state protectionism and financial subsidies for local cinema","The AI Act","ICANN regulations"],a:1,e:"Under WTO rules, cinema enjoys a Cultural Diversity Exception — allowing states to subsidize and protect local film industries despite free trade rules."},

let cur=0,score=0,answered=false;
let tScores={},tTotals={};

function startQuiz(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  renderQ();
}

function renderQ(){
  const q=Q[cur],total=Q.length;
  document.getElementById('prog-bar').style.width=((cur/total)*100)+'%';
  document.getElementById('prog-text').textContent=`Question ${cur+1} of ${total}`;
  document.getElementById('q-num-badge').textContent=`Q${cur+1}`;
  const tb=document.getElementById('topic-badge');
  tb.textContent=q.t; tb.className='topic-badge '+q.b;
  document.getElementById('q-text').textContent=q.q;
  const wrap=document.getElementById('options-wrap');
  wrap.innerHTML='';
  ['A','B','C','D'].forEach((l,i)=>{
    const btn=document.createElement('button');
    btn.className='option';
    btn.innerHTML=`<span class="option-letter">${l}</span><span>${q.o[i]}</span>`;
    btn.addEventListener('click',()=>pick(i));
    wrap.appendChild(btn);
  });
  const exp=document.getElementById('explanation');
  exp.className='explanation'; exp.textContent='';
  document.getElementById('btn-next').className='btn-next';
  answered=false;
}

function pick(chosen){
  if(answered)return;
  answered=true;
  const q=Q[cur];
  const opts=document.querySelectorAll('.option');
  if(!tTotals[q.t]){tTotals[q.t]=0;tScores[q.t]=0;}
  tTotals[q.t]++;
  opts.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.a) btn.classList.add(chosen===q.a?'correct':'reveal');
    else if(i===chosen) btn.classList.add('wrong');
  });
  if(chosen===q.a){score++;tScores[q.t]++;}
  const exp=document.getElementById('explanation');
  exp.textContent=q.e; exp.classList.add('show');
  const nb=document.getElementById('btn-next');
  nb.classList.add('show');
  nb.textContent=cur<Q.length-1?'Next Question →':'See Results →';
}

function nextQuestion(){
  cur++;
  if(cur>=Q.length)showResults();
  else{renderQ();window.scrollTo(0,0);}
}

function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('results').style.display='block';
  const pct=Math.round((score/Q.length)*100);
  document.getElementById('score-num').textContent=`${score}/${Q.length}`;
  document.getElementById('score-circle').style.setProperty('--pct',pct+'%');
  const [title,sub]=pct>=90?['🏆 Outstanding!','You\'re ready for the final exam!']:
    pct>=75?['✅ Great work!','A few more reviews and you\'ll ace it.']:
    pct>=60?['📚 Good progress','Focus on the weaker topics below.']:
    ['💪 Keep studying','Review the topics and try again!'];
  document.getElementById('results-title').textContent=title;
  document.getElementById('results-sub').textContent=`${pct}% correct — ${sub}`;
  const bd=document.getElementById('topic-breakdown');
  bd.innerHTML='';
  Object.keys(tTotals).forEach(t=>{
    const s=tScores[t]||0,tt=tTotals[t],p=Math.round((s/tt)*100);
    bd.innerHTML+=`<div class="topic-row"><span class="topic-name">${t}</span><div class="topic-bar-bg"><div class="topic-bar" style="width:${p}%"></div></div><span class="topic-score">${s}/${tt}</span></div>`;
  });
}

function restartQuiz(){
  cur=0;score=0;answered=false;tScores={};tTotals={};
  document.getElementById('results').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  renderQ();window.scrollTo(0,0);
}
</script>
